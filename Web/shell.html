<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Compass Cadence — Lyricist & Metric Notepad</title>
  <meta name="description" content="Multi-meter lyric notebook with syllable counts, phoneme rhymes, and live syncopated playback.">
  <meta name="theme-color" content="#F5F2EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Compass Cadence">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F2EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #F5F2EB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.4s ease-out;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 700;
      color: #333338;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 13px;
      color: #8C8C94;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top-color: #D97706;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading-status {
      font-size: 12px;
      color: #71717A;
      margin-top: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #audio-unlock-prompt {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(39, 39, 42, 0.92);
      color: #F4F4F5;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      z-index: 999;
      cursor: pointer;
      backdrop-filter: blur(8px);
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="loading-title">Compass Cadence</div>
    <div class="loading-sub">Loading notebook engine & WebAssembly...</div>
    <div class="spinner"></div>
    <div id="loading-status">Downloading wasm...</div>
  </div>

  <div id="canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="audio-unlock-prompt" onclick="unlockAudio()">
    Tap anywhere to enable sound & metronome
  </div>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('ServiceWorker registration optional: ', err);
        });
      });
    }

    // Web Audio Auto-Unlock for Browsers / iOS
    function unlockAudio() {
      const prompt = document.getElementById('audio-unlock-prompt');
      if (prompt) prompt.style.display = 'none';

      // Resume AudioContext if created by Emscripten / WebAudio
      if (typeof JSEvents !== 'undefined' && JSEvents.audioContext) {
        if (JSEvents.audioContext.state === 'suspended') {
          JSEvents.audioContext.resume();
        }
      }
      if (window.AudioContext || window.webkitAudioContext) {
        const dummyCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (dummyCtx.state === 'suspended') {
          dummyCtx.resume();
        }
      }
    }
    window.addEventListener('pointerdown', unlockAudio, { once: true });

    // Emscripten Module Config
    var statusElement = document.getElementById('loading-status');
    var overlay = document.getElementById('loading-overlay');
    var canvas = document.getElementById('canvas');

    var Module = {
      canvas: canvas,
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      setStatus: function(text) {
        if (!text) {
          if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 400);
          }
          return;
        }
        if (statusElement) statusElement.innerText = text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...' : '');
      }
    };

    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
